name: "🌳 Deforestation: Cleanup Old Release Branches"

on:
  schedule:
    - cron: "0 0 1 * *" # Once a month
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Activer le mode dry-run (ne supprime pas les branches)"
        required: false
        default: "true"

permissions: {}

jobs:
  cleanup-release-branches:
    name: "🌳 Deforestation Job"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🌳 Prune release branches
        uses: proconnect-gouv/release-action/prune-branches@aabbb2ed4d87456c578f17118a0621a4145cdfee # v1.3.0
        with:
          dry-run: ${{ inputs.dry_run || 'false' }}
